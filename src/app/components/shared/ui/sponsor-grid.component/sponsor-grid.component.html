@if (sponsors; as tiers) {
  <div class="space-y-6">
    @for (tier of tierOrder; track tier) {
      @if (tiers[tier].length) {
        <section>
          <h3 class="mb-3 text-xl font-semibold text-slate-900">{{ tierLabels[tier] }}</h3>
          <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
            @for (sponsor of tiers[tier]; track sponsor.id) {
              <article
                class="rounded-xl border bg-white p-4 shadow-sm"
                [class.border-sky-200]="isHighlighted(sponsor)"
                [class.bg-sky-50]="isHighlighted(sponsor)"
              >
                @if (isHighlighted(sponsor)) {
                  <p class="mb-2 inline-block rounded-full bg-sky-100 px-2 py-1 text-xs font-medium text-sky-700">
                    Highlight sponsor
                  </p>
                }

                <h4 class="text-lg font-semibold text-slate-900">{{ sponsor.name }}</h4>
                <p class="mt-1 text-sm text-slate-700">{{ sponsor.tagline }}</p>
                <a
                  [href]="sponsor.url"
                  class="mt-3 inline-block text-sm font-medium text-sky-700 hover:underline"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Visit sponsor
                </a>
              </article>
            }
          </div>
        </section>
      }
    }
  </div>
}
