@if (event; as item) {
  <article
    class="rounded-xl border bg-white p-4 shadow-sm transition"
    [class.border-sky-200]="item.highlighted"
    [class.bg-sky-50]="item.highlighted"
  >
    <div class="mb-2 flex items-center justify-between gap-3">
      <p class="text-sm font-semibold text-slate-700">{{ item.time }}</p>
      @if (showTrack) {
        <span class="rounded-full border border-slate-200 px-2 py-1 text-xs text-slate-600">
          {{ item.track }}
        </span>
      }
    </div>

    <p class="text-xs font-medium uppercase tracking-wide text-slate-500">{{ item.type }}</p>
    <h3 class="mt-1 text-lg font-semibold text-slate-900">{{ item.title }}</h3>
    <p class="mt-1 text-sm text-slate-600">{{ item.speakerName }}</p>

    <p class="mt-3 text-sm text-slate-700">
      <span class="font-semibold">Key point:</span> {{ item.keyPoint }}
    </p>
  </article>
}
