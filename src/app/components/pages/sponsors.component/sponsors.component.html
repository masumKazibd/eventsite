<section class="space-y-10 max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
  
  <!-- HERO HEADER -->
  <div class="rounded-3xl border border-slate-200 bg-white p-8 md:p-12 shadow-sm relative overflow-hidden">
    <!-- Subtle Indigo Background Glow -->
    <div class="absolute -top-24 -right-24 w-72 h-72 bg-indigo-50 rounded-full blur-3xl opacity-60 pointer-events-none"></div>
    
    <div class="relative z-10">
      <p class="text-sm font-bold uppercase tracking-[0.2em] text-indigo-600 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-indigo-500"></span> Supporters
      </p>
      <h1 class="mt-4 text-4xl font-extrabold tracking-tight text-slate-900 sm:text-5xl">
        Trusted partners driving the <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-rose-500">event experience</span>.
      </h1>
      <p class="mt-4 max-w-2xl text-lg text-slate-600 leading-relaxed">
        From bug bounty platforms to enterprise defense vendors, these sponsors are helping create a high-energy community experience.
      </p>
    </div>
  </div>

  <!-- SPONSOR TIER GRID -->
  <div class="px-2 sm:px-4">
    <app-sponsor-grid 
      [sponsors]="sponsors()" 
      [highlightedSponsorIds]="['spon-01', 'spon-02']">
    </app-sponsor-grid>
  </div>
  
</section>
