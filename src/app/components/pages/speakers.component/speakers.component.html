<section class="space-y-10 max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
  
  <!-- HERO HEADER -->
  <div class="rounded-3xl border border-slate-200 bg-white p-8 md:p-12 shadow-sm relative overflow-hidden">
    <div class="absolute -top-24 -right-24 w-72 h-72 bg-indigo-50 rounded-full blur-3xl opacity-60 pointer-events-none"></div>
    
    <div class="relative z-10">
      <p class="text-sm font-bold uppercase tracking-[0.2em] text-indigo-600 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-indigo-500"></span> Featured voices
      </p>
      <h1 class="mt-4 text-4xl font-extrabold tracking-tight text-slate-900 sm:text-5xl">
        Meet the researchers & <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-rose-500">operators</span>.
      </h1>
      <p class="mt-4 max-w-2xl text-lg text-slate-600 leading-relaxed">
        Every speaker contributes real-world insight across offensive security, cloud defense, and bug bounty operations.
      </p>
    </div>
  </div>

  <!-- SPEAKER GRID (Entire Card is Clickable) -->
  <div class="grid gap-6 md:grid-cols-2 xl:grid-cols-3">
    @for (speaker of speakers(); track speaker.id) {
      <!-- Replaced the div wrapper with an anchor tag containing the routerLink -->
      <a [routerLink]="['/speakers', slugify(speaker.name)]" 
         class="group block rounded-2xl border border-slate-200 bg-white p-5 shadow-sm hover:shadow-md hover:border-indigo-300 hover:bg-slate-50 transition-all cursor-pointer focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
        
        <!-- The inner component just handles the visual layout of the avatar and text -->
        <app-speaker-card [speaker]="speaker" [featured]="speaker.highlighted ?? false"></app-speaker-card>
        
      </a>
    }
  </div>
</section>
