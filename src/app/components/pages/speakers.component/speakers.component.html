<section class="space-y-8">
  <div class="rounded-3xl border border-slate-200 bg-white p-8 shadow-sm">
    <p class="text-sm font-semibold uppercase tracking-[0.3em] text-sky-700">Featured voices</p>
    <h1 class="mt-3 text-3xl font-bold text-slate-900">Meet the researchers and operators shaping the event.</h1>
    <p class="mt-3 max-w-2xl text-slate-600">Every speaker contributes real-world insight across offensive security, cloud defense, and bug bounty operations.</p>
  </div>

  <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
    @for (speaker of speakers(); track speaker.id) {
      <div class="space-y-3">
        <app-speaker-card [speaker]="speaker" [featured]="speaker.highlighted ?? false"></app-speaker-card>
        <a [routerLink]="['/speakers', slugify(speaker.name)]" class="inline-flex text-sm font-semibold text-sky-700">
          Read profile →
        </a>
      </div>
    }
  </div>
</section>
