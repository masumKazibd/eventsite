<section class="space-y-10 max-w-4xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
  
  <!-- HERO HEADER -->
  <div class="rounded-3xl border border-slate-200 bg-white p-8 md:p-12 shadow-sm relative overflow-hidden">
    <div class="absolute -top-24 -right-24 w-72 h-72 bg-indigo-50 rounded-full blur-3xl opacity-60 pointer-events-none"></div>
    
    <div class="relative z-10">
      <p class="text-sm font-bold uppercase tracking-[0.2em] text-indigo-600 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-indigo-500"></span> Details & Logistics
      </p>
      <h1 class="mt-4 text-4xl font-extrabold tracking-tight text-slate-900 sm:text-5xl">
        Frequently Asked <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-rose-500">Questions</span>.
      </h1>
      <p class="mt-4 max-w-2xl text-lg text-slate-600 leading-relaxed">
        Find answers to common questions about the event, registration, and CTF participation.
      </p>
    </div>
  </div>

  <!-- FAQ LIST -->
  <div class="space-y-4">
    @for (faq of faqs(); track faq.id) {
      <article class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm hover:border-indigo-200 transition-colors">
        <h3 class="text-lg font-bold text-slate-900 flex items-start gap-3">
          <span class="text-indigo-500 mt-1 shrink-0">
            <!-- Information Icon -->
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </span>
          {{ faq.question }}
        </h3>
        <p class="mt-3 text-slate-600 leading-relaxed ml-8">
          {{ faq.answer }}
        </p>
      </article>
    }
  </div>

</section>
