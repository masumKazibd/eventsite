<section class="space-y-8">
  <div class="rounded-3xl border border-slate-200 bg-white p-8 shadow-sm">
    <p class="text-sm font-semibold uppercase tracking-[0.3em] text-sky-700">FAQ</p>
    <h1 class="mt-3 text-3xl font-bold text-slate-900">Frequently Asked Questions</h1>
    <p class="mt-3 max-w-2xl text-slate-600">Find answers to common questions about the event, registration, and more.</p>
  </div>

  <!-- <app-sponsor-grid [sponsors]="sponsors()" [highlightedSponsorIds]="['spon-01', 'spon-02']"></app-sponsor-grid> -->
</section>
<section class="space-y-10 max-w-4xl mx-auto px-4 py-8 sm:px-6 lg:px-8">

  <!-- FAQ LIST -->
  <div class="space-y-4">
    @for (faq of faqs(); track faq.id) {
      <article class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm hover:border-indigo-200 transition-colors">
        <h3 class="text-lg font-bold text-slate-900 flex items-start gap-3">
          <span class="text-indigo-500 mt-1 shrink-0">
            <!-- Information Icon -->
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </span>
          {{ faq.question }}
        </h3>
        <p class="mt-3 text-slate-600 leading-relaxed ml-8">
          {{ faq.answer }}
        </p>
      </article>
    }
  </div>

</section>
